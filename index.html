<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press kits</title>
<style>
 :root { color-scheme: light dark; --bg:#fff; --fg:#111; --dim:#666; --accent:#1971c2; }
 @media (prefers-color-scheme: dark) { :root { --bg:#131313; --fg:#eee; --dim:#999; --accent:#74c0fc; } }
 body { margin:0; padding:48px 20px; background:var(--bg); color:var(--fg);
   font:16px/1.7 ui-sans-serif, system-ui, -apple-system, sans-serif; }
 main { max-width:560px; margin:0 auto; }
 h1 { font-size:24px; margin:0 0 8px; }
 p { color:var(--dim); }
 a { color:var(--accent); }
</style>
<main>
  <h1>Press kits</h1>
  <p>Each game's kit has its own address. If you were sent one, use that link.</p>
</main>
